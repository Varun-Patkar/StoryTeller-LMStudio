<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="StoryTeller">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset=".45" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="page" x1="32" y1="16" x2="32" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>

  <!-- vibrant rounded tile -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- open book -->
  <g>
    <path d="M32 19 C25.5 15, 16 15, 11.5 18 L11.5 45 C16 42, 25.5 42, 32 46 Z" fill="url(#page)"/>
    <path d="M32 19 C38.5 15, 48 15, 52.5 18 L52.5 45 C48 42, 38.5 42, 32 46 Z" fill="url(#page)"/>
    <path d="M32 19 L32 46" stroke="#8b5cf6" stroke-width="1.6" opacity=".55" fill="none"/>
    <g stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" opacity=".7">
      <line x1="16.5" y1="23.5" x2="27.5" y2="25.5"/>
      <line x1="16.5" y1="28.5" x2="27.5" y2="30.5"/>
      <line x1="16.5" y1="33.5" x2="27.5" y2="35.5"/>
      <line x1="36.5" y1="25.5" x2="47.5" y2="23.5"/>
      <line x1="36.5" y1="30.5" x2="47.5" y2="28.5"/>
      <line x1="36.5" y1="35.5" x2="47.5" y2="33.5"/>
    </g>
  </g>

  <!-- story spark -->
  <path d="M49 8 l1.9 4.9 4.9 1.9 -4.9 1.9 -1.9 4.9 -1.9 -4.9 -4.9 -1.9 4.9 -1.9 Z" fill="#fff7cc"/>
</svg>
